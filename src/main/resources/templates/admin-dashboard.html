<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- ========================================== -->
<!-- NAVIGATION -->
<!-- ========================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/admin-dashboard">

            Student Placement Portal

        </a>


        <div>

            <a
                href="/students"
                class="btn btn-outline-light btn-sm">

                Students

            </a>


            <a
                href="/companies"
                class="btn btn-outline-light btn-sm">

                Companies

            </a>


            <a
                href="/placements"
                class="btn btn-outline-light btn-sm">

                Placements

            </a>


            <a
                href="/logout"
                class="btn btn-danger btn-sm">

                Logout

            </a>

        </div>

    </div>

</nav>



<div class="container mt-5">


    <!-- ========================================== -->
    <!-- HEADING -->
    <!-- ========================================== -->

    <div class="text-center mb-5">

        <h1>
            Admin Dashboard
        </h1>

        <p class="text-muted">

            Welcome,
            <strong th:text="${username}">
                Admin
            </strong>

        </p>

    </div>



    <!-- ========================================== -->
    <!-- STATISTICS -->
    <!-- ========================================== -->

    <div class="row text-center mb-5">


        <!-- Students -->

        <div class="col-md-4 mb-3">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4>
                        Total Students
                    </h4>

                    <h1
                        class="text-primary"
                        th:text="${studentCount}">

                        0

                    </h1>

                    <a
                        href="/students"
                        class="btn btn-primary">

                        Manage Students

                    </a>

                </div>

            </div>

        </div>



        <!-- Companies -->

        <div class="col-md-4 mb-3">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4>
                        Total Companies
                    </h4>

                    <h1
                        class="text-success"
                        th:text="${companyCount}">

                        0

                    </h1>

                    <a
                        href="/companies"
                        class="btn btn-success">

                        Manage Companies

                    </a>

                </div>

            </div>

        </div>



        <!-- Placements -->

        <div class="col-md-4 mb-3">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4>
                        Total Placements
                    </h4>

                    <h1
                        class="text-warning"
                        th:text="${placementCount}">

                        0

                    </h1>

                    <a
                        href="/placements"
                        class="btn btn-warning">

                        Manage Placements

                    </a>

                </div>

            </div>

        </div>


    </div>



    <!-- ========================================== -->
    <!-- QUICK ACTIONS -->
    <!-- ========================================== -->

    <div class="card shadow">

        <div class="card-body">

            <h3 class="mb-4">

                Quick Actions

            </h3>


            <a
                href="/students"
                class="btn btn-primary me-2">

                Add Student

            </a>


            <a
                href="/companies"
                class="btn btn-success me-2">

                Add Company

            </a>


            <a
                href="/placements"
                class="btn btn-warning">

                Add Placement

            </a>

        </div>

    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
