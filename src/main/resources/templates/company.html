<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Company Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <!-- Page Heading -->
    <h1 class="text-center mb-4">
        Company Management
    </h1>


    <!-- ============================= -->
    <!-- Company Registration Form -->
    <!-- ============================= -->

    <div class="card mb-5">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Register Company
            </h4>
        </div>

        <div class="card-body">

            <form
                th:action="@{/companies/save}"
                th:object="${company}"
                method="post">

                <!-- Hidden Company ID -->
                <input
                    type="hidden"
                    th:field="*{companyId}">


                <!-- Company Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Company Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{companyName}"
                        placeholder="Enter Company Name"
                        required>

                </div>


                <!-- Location -->
                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{location}"
                        placeholder="Enter Company Location"
                        required>

                </div>


                <!-- Package -->
                <div class="mb-3">

                    <label class="form-label">
                        Package (LPA)
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        th:field="*{packageLpa}"
                        placeholder="Example: 7.50"
                        required>

                </div>


                <!-- Minimum CGPA -->
                <div class="mb-3">

                    <label class="form-label">
                        Minimum CGPA
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        th:field="*{minimumCgpa}"
                        placeholder="Example: 6.00"
                        required>

                </div>


                <!-- Save Button -->
                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Company

                </button>

            </form>

        </div>

    </div>



    <!-- ============================= -->
    <!-- Company List -->
    <!-- ============================= -->

    <h2 class="mb-3">
        Company List
    </h2>


    <div class="table-responsive">

        <table class="table table-bordered table-striped table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Company Name</th>

                    <th>Location</th>

                    <th>Package (LPA)</th>

                    <th>Minimum CGPA</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="company : ${companies}">

                    <td th:text="${company.companyId}">
                    </td>

                    <td th:text="${company.companyName}">
                    </td>

                    <td th:text="${company.location}">
                    </td>

                    <td th:text="${company.packageLpa}">
                    </td>

                    <td th:text="${company.minimumCgpa}">
                    </td>


                    <!-- Action Buttons -->

                    <td>

                        <a
                            th:href="@{/companies/edit/{id}(id=${company.companyId})}"
                            class="btn btn-warning btn-sm">

                            Edit

                        </a>


                        <a
                            th:href="@{/companies/delete/{id}(id=${company.companyId})}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure you want to delete this company?');">

                            Delete

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
