<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Login - Student Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2>
                            Student Placement Portal
                        </h2>

                        <p class="text-muted">
                            Teacher / Admin Login
                        </p>

                    </div>


                    <!-- Error Message -->

                    <div
                        th:if="${error}"
                        class="alert alert-danger">

                        <span th:text="${error}">
                        </span>

                    </div>


                    <!-- Teacher Login Form -->

                    <form
                        th:action="@{/teacher-login}"
                        method="post">


                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Teacher / Admin Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
