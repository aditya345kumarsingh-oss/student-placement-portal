<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - Student Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2>
                            Student Placement Portal
                        </h2>

                        <p class="text-muted">
                            Student Login
                        </p>

                    </div>


                    <!-- Error Message -->

                    <div
                        th:if="${error}"
                        class="alert alert-danger">

                        <span
                            th:text="${error}">
                        </span>

                    </div>


                    <!-- Student Login Form -->

                    <form
                        th:action="@{/student-login}"
                        method="post">


                        <!-- Student ID -->

                        <div class="mb-3">

                            <label class="form-label">
                                Student ID
                            </label>

                            <input
                                type="number"
                                name="studentId"
                                class="form-control"
                                placeholder="Enter Student ID"
                                required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter registered email"
                                required>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Student Login

                        </button>

                    </form>


                    <!-- Admin Login -->

                    <div class="text-center mt-4">

                        <a href="/login">
                            Admin / Teacher Login
                        </a>

                    </div>


                    <!-- Back -->

                    <div class="text-center mt-2">

                        <a href="/">
                            Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
